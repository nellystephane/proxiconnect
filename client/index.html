<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ProxiConnect — Services et commerce de proximité</title>
    <meta name="description" content="ProxiConnect connecte vendeurs, restaurateurs, hôteliers et livreurs avec leurs clients, près de chez eux." />

    <!-- Icônes -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- PWA / thème -->
    <meta name="theme-color" content="#007AFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ProxiConnect" />

    <!-- Résolution du thème AVANT le premier rendu, pour ne jamais afficher
         un flash clair/sombre incorrect. Doit rester synchrone et minuscule :
         aucune dépendance externe, s'exécute avant que le CSS ne peigne la page. -->
    <script>
      (function () {
        try {
          var stocke = localStorage.getItem('proxiconnect_theme'); // 'light' | 'dark' | 'system' | null
          var systeme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var resolu = (stocke === 'light' || stocke === 'dark') ? stocke : systeme;
          document.documentElement.setAttribute('data-theme', resolu);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
